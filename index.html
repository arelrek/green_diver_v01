<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Green Diver</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
body { margin:0; background:#000; }
</style>
</head>
<body>
<script>

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 500 }, debug: false }
    },
    scene: { preload, create, update }
};

let player, cursors, bg1, bg2, bg3;
let gameOver = false;
let speed = 200;

new Phaser.Game(config);

function preload() {
    // 스프라이트 시트
    this.load.spritesheet('diver', 'assets/diver_ani.png', {
        frameWidth: 86,
        frameHeight: 56
    });

    // 배경
    this.load.image('bg1', 'assets/bg1.png');
    this.load.image('bg2', 'assets/bg2.png');
    this.load.image('bg3', 'assets/bg3.png');

    // 사운드
   //this.load.audio('jump', 'assets/jump.mp3');
    //this.load.audio('coin', 'assets/coin.mp3');
    //this.load.audio('hit', 'assets/hit.mp3');
}

function create() {
    // 🎵 사운드
    this.sfxJump = this.sound.add('jump');
    this.sfxCoin = this.sound.add('coin');
    this.sfxHit = this.sound.add('hit');

    // 🌊 패럴랙스 배경
    bg1 = this.add.tileSprite(400, 225, 800, 450, 'bg1');
    bg2 = this.add.tileSprite(400, 225, 800, 450, 'bg2');
    bg3 = this.add.tileSprite(400, 225, 800, 450, 'bg3');

    // 🐬 플레이어
    player = this.physics.add.sprite(150, 200, 'diver');

    // 애니메이션
    this.anims.create({
        key: 'swim',
        frames: this.anims.generateFrameNumbers('diver', { start: 0, end: 1 }),
        frameRate: 6,
        repeat: -1
    });

    player.play('swim');

    player.setCollideWorldBounds(true);

    // 입력
    cursors = this.input.keyboard.createCursorKeys();

    this.input.keyboard.on('keydown-SPACE', () => jump.call(this));
    this.input.keyboard.on('keydown-R', () => restart.call(this));
    this.input.on('pointerdown', () => jump.call(this));
}

function update() {

    if (gameOver) return;

    // 🌊 배경 스크롤 (패럴랙스)
    bg1.tilePositionX += 0.3;
    bg2.tilePositionX += 0.6;
    bg3.tilePositionX += 1.2;

    // 이동
    player.setVelocityX(0);

    if (cursors.left.isDown) {
        player.setVelocityX(-200);
    }
    else if (cursors.right.isDown) {
        player.setVelocityX(200);
    }

    // 낙하 체크
    if (player.y > 440) {
        hitGame.call(this);
    }
}

// 점프
function jump() {
    if (gameOver) return;
    player.setVelocityY(-300);
    this.sfxJump.play();
}

// 게임오버
function hitGame() {
    gameOver = true;
    player.setTint(0xff0000);
    player.anims.stop();
    this.sfxHit.play();

    this.add.text(400, 200, 'GAME OVER\nR to Restart', {
        fontSize: '32px',
        fill: '#fff'
    }).setOrigin(0.5);
}

// 재시작
function restart() {
    if (!gameOver) return;
    location.reload();
}

</script>
</body>
</html>
