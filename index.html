<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Green Diver</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh;}
</style>
</head>
<body>

<script>
const GW = 800, GH = 450;
const GRAVITY = 500;
const JUMP_V = -300;

let player, bg1, bg2, bg3;
let playerVY = 0;
let isGameOver = false;
let finTimer = 0, finFrame = 0;
let bubbles = [];

let obstacles, items;

const config = {
    type: Phaser.AUTO,
    width: GW,
    height: GH,
    physics: { default: 'arcade', arcade: { gravity:{y:0} }},
    scene: { preload, create, update }
};

new Phaser.Game(config);

/* ================= PRELOAD ================= */
function preload(){
    this.load.image('diver_a','assets/diver_a.png');
    this.load.image('diver_b','assets/diver_b.png');

    this.load.image('bg1','assets/bg1.png');
    this.load.image('bg2','assets/bg2.png');
    this.load.image('bg3','assets/bg3.png');

    this.load.image('coral1','assets/coral1.png');
    this.load.image('coral2','assets/coral2.png');
    this.load.image('coral3','assets/coral3.png');

    this.load.image('weed','assets/weed.png');

    this.load.image('turtle','assets/turtle.png');
    this.load.image('dolphin','assets/dolphin.png');
}

/* ================= CREATE ================= */
function create(){

    // 배경
    bg1 = this.add.tileSprite(GW/2,GH/2,GW,GH,'bg1').setDepth(-3);
    bg2 = this.add.tileSprite(GW/2,GH/2,GW,GH,'bg2').setDepth(-2);
    bg3 = this.add.tileSprite(GW/2,GH/2,GW,GH,'bg3').setDepth(-1);

    // 플레이어
    player = this.add.image(150,GH/2,'diver_a');

    // 그룹
    obstacles = this.physics.add.group();
    items = this.physics.add.group();

    // 입력
    this.input.keyboard.on('keydown-SPACE',()=> handleInput.call(this));
    this.input.keyboard.on('keydown-R',()=> restart.call(this));
    this.input.on('pointerdown',()=> handleInput.call(this));

    // 스폰
    this.time.addEvent({delay:2000, callback:spawnObstacle, callbackScope:this, loop:true});
    this.time.addEvent({delay:3000, callback:spawnItem, callbackScope:this, loop:true});

    // UI
    this.gameOverText = this.add.text(GW/2,GH/2,'',{
        fontSize:'32px',fill:'#fff',backgroundColor:'#00000088'
    }).setOrigin(0.5);
}

/* ================= UPDATE ================= */
function update(time,delta){
    if(isGameOver) return;
    const dt = delta/1000;

    // 패럴랙스
    bg1.tilePositionX += 0.3;
    bg2.tilePositionX += 0.8;
    bg3.tilePositionX += 1.5;

    // 물리
    playerVY += GRAVITY * dt;
    player.y += playerVY * dt;

    // 애니메이션
    finTimer += delta;
    if(finTimer > 200){
        finTimer = 0;
        finFrame = 1 - finFrame;
        player.setTexture(finFrame ? 'diver_b':'diver_a');
    }

    // 물방울 (머리쪽)
    if(Math.random() < 0.1){
        const b = this.add.circle(
            player.x + 20,
            player.y - 20,
            2,0xaaddff,0.6
        );
        bubbles.push(b);
    }

    bubbles = bubbles.filter(b=>{
        b.y -= 1;
        b.alpha -= 0.01;
        if(b.alpha<=0){ b.destroy(); return false;}
        return true;
    });

    // 장애물 이동
    obstacles.getChildren().forEach(o=>{
        o.x -= 3;
        if(o.x < -50) o.destroy();

        if(Phaser.Math.Distance.Between(player.x,player.y,o.x,o.y) < 40){
            gameOver.call(this);
        }
    });

    // 아이템
    items.getChildren().forEach(i=>{
        i.x -= 3;
        if(i.x < -50) i.destroy();

        if(Phaser.Math.Distance.Between(player.x,player.y,i.x,i.y) < 40){
            i.destroy();
        }
    });
}

/* ================= INPUT ================= */
function handleInput(){
    if(isGameOver){
        restart.call(this);
    }else{
        playerVY = JUMP_V;
    }
}

/* ================= SPAWN ================= */
function spawnObstacle(){
    const types = ['coral1','coral2','coral3'];
    const key = types[Math.floor(Math.random()*types.length)];

    const o = this.add.image(GW+50, GH-50, key);
    obstacles.add(o);

    // 위 수초
    if(Math.random() > 0.5){
        const w = this.add.image(GW+50,50,'weed');
        obstacles.add(w);
    }
}

function spawnItem(){
    const key = Math.random()>0.5 ? 'turtle':'dolphin';
    const i = this.add.image(GW+50, Phaser.Math.Between(100,350), key);
    items.add(i);
}

/* ================= GAME ================= */
function gameOver(){
    isGameOver = true;
    this.gameOverText.setText('GAME OVER\nR or 클릭');
}

function restart(){
    isGameOver = false;
    player.setPosition(150,GH/2);
    playerVY = 0;
    this.gameOverText.setText('');

    obstacles.clear(true,true);
    items.clear(true,true);
}
</script>
</body>
</html>
