<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>

const GW=800, GH=450;

let player, obstacles, items, trashGroup;
let playerVY=0, baseSpeed=2, speedBoost=0;

let hp=100, eco=0;
let isGameOver=false;

let turtle=null, dolphin=null;
let turtleHP=0, dolphinHP=0;

let hpBar, ecoBar;

/* ================= CONFIG ================= */
const config = {
    type: Phaser.AUTO,
    width: GW,
    height: GH,
    physics: { default:'arcade' },
    scene: { preload, create, update }
};

new Phaser.Game(config);

/* ================= PRELOAD ================= */
function preload(){
    this.load.image('diver_a','assets/diver_a.png');
    this.load.image('diver_b','assets/diver_b.png');

    this.load.image('coral1','assets/coral1.png');
    this.load.image('coral2','assets/coral2.png');
    this.load.image('coral3','assets/coral3.png');
    this.load.image('weed','assets/weed.png');

    this.load.image('turtle_item','assets/turtle.png');
    this.load.image('turtle_active','assets/turtle1.png');

    this.load.image('dolphin_item','assets/dolphin.png');
    this.load.image('dolphin_active','assets/dolphin1.png');

    this.load.image('trash1','assets/trash1.png');
    this.load.image('trash2','assets/trash2.png');
    this.load.image('trash3','assets/trash3.png');
}

/* ================= CREATE ================= */
function create(){

    player=this.add.image(150,GH/2,'diver_a');

    obstacles=this.add.group();
    items=this.add.group();
    trashGroup=this.add.group();

    hpBar=this.add.rectangle(20,20,200,15,0x00ffcc).setOrigin(0);
    ecoBar=this.add.rectangle(20,40,0,10,0x00ff88).setOrigin(0);

    this.input.on('pointerdown',()=>jump());
    this.input.keyboard.on('keydown-SPACE',()=>jump());

    this.time.addEvent({delay:1200, callback:spawnObstacle, callbackScope:this, loop:true});
    this.time.addEvent({delay:2000, callback:spawnTrash, callbackScope:this, loop:true});
    this.time.addEvent({delay:5000, callback:spawnItem, callbackScope:this, loop:true});
}

/* ================= UPDATE ================= */
function update(time,delta){

    if(isGameOver) return;

    const dt=delta/1000;
    const currentSpeed = baseSpeed + speedBoost;

    // 중력
    playerVY+=500*dt;
    player.y+=playerVY*dt;

    // 경계
    if(player.y<20 || player.y>GH-20){
        damage(1);
    }

    // 애니
    player.setTexture(time%300<150?'diver_a':'diver_b');

    // 장애물
    obstacles.getChildren().forEach(o=>{
        o.x -= currentSpeed * o.speed;

        if(collide(player,o)) hitObstacle();

        if(o.x<-50) o.destroy();
    });

    // 쓰레기
    trashGroup.getChildren().forEach(t=>{
        t.x -= currentSpeed;

        if(collide(player,t)){
            t.destroy();
            eco=Math.min(100,eco+20);
        }

        if(t.x<-50) t.destroy();
    });

    // 아이템
    items.getChildren().forEach(i=>{
        i.x -= currentSpeed;

        i.y += Math.sin(time*0.005)*1;

        if(collide(player,i)){
            applyItem.call(this,i.itemType);
            i.destroy();
        }
    });

    // 🟢 거북이 (완전 고정)
    if(turtle){
        turtle.x = player.x + 40;
        turtle.y = player.y;
    }

    // 🔵 돌고래 (웨이브)
    if(dolphin){
        dolphin.x = player.x + 50;
        dolphin.y = player.y + Math.sin(time*0.01)*20;
    }

    hpBar.width = hp*2;
    ecoBar.width = eco*2;
}

/* ================= 충돌 ================= */
function collide(a,b){
    return Phaser.Math.Distance.Between(a.x,a.y,b.x,b.y)<40;
}

/* ================= 데미지 ================= */
function damage(d){
    if(eco>0){
        eco-=d;
        return;
    }

    hp-=d;
    if(hp<=0){
        isGameOver=true;
        alert("GAME OVER");
    }
}

/* ================= 장애물 ================= */
function hitObstacle(){

    if(turtle){
        turtleHP--;
        if(turtleHP<=0){
            turtle.destroy();
            turtle=null;
        }
        return;
    }

    if(dolphin){
        dolphinHP--;
        if(dolphinHP<=0){
            dolphin.destroy();
            dolphin=null;
            speedBoost=0;
        }
        return;
    }

    damage(10);
}

/* ================= 아이템 ================= */
function applyItem(type){

    if(type==='turtle_item'){
        if(turtle) turtle.destroy();

        turtle=this.add.image(player.x+40,player.y,'turtle_active').setScale(0.5);
        turtleHP=3;
    }

    if(type==='dolphin_item'){
        if(dolphin) dolphin.destroy();

        dolphin=this.add.image(player.x+50,player.y,'dolphin_active').setScale(0.6);
        dolphinHP=3;
        speedBoost=2;
    }
}

/* ================= 스폰 ================= */
function spawnObstacle(){
    const types=['coral1','coral2','coral3','weed'];
    const key=types[Math.floor(Math.random()*types.length)];

    const y = key==='weed'
        ? Phaser.Math.Between(50,150)
        : Phaser.Math.Between(GH-120,GH-40);

    const o=this.add.image(GW+50,y,key);

    o.speed=Phaser.Math.Between(1,3);

    obstacles.add(o);
}

function spawnTrash(){
    const types=['trash1','trash2','trash3'];
    const key=types[Math.floor(Math.random()*types.length)];

    const t=this.add.image(GW+50,Phaser.Math.Between(80,350),key);
    trashGroup.add(t);
}

function spawnItem(){

    const key = Math.random()>0.5 ? 'turtle_item' : 'dolphin_item';

    const i=this.add.image(GW+50,Phaser.Math.Between(100,300),key);

    i.itemType=key;

    items.add(i);
}

/* ================= 점프 ================= */
function jump(){
    if(isGameOver) return;
    playerVY=-300;
}

</script>
